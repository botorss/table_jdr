<!DOCTYPE html>

<html lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#090909" name="theme-color"/><meta content="yes" name="apple-mobile-web-app-capable"/><meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/><meta content="Table JDR" name="apple-mobile-web-app-title"/><title>Table JDR</title><link href="manifest.webmanifest" rel="manifest"/><link href="style.css?v=scene-controls-2" rel="stylesheet"/></head><body>
<header><b>◈ JDR</b><div class="scene-title-actions"><input aria-label="Scène" id="title" value="" placeholder="Nom de la scène" maxlength="200"/><button id="save-scene-zip" class="scene-header-button" type="button" title="Enregistrer toute la scène dans une archive ZIP" aria-label="Sauvegarder la scène"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v6h8V3"/></svg></button><button id="load-scene-zip" class="scene-header-button" type="button" title="Ouvrir une scène ZIP" aria-label="Charger une scène"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v2"/><path d="M3 9h18l-2 11H5L3 9Z"/></svg></button></div><nav><input id="scene-zip-file" type="file" accept=".zip,application/zip" hidden/><div class="header-connection" id="header-connection"><div class="qr-help" hidden="True" id="qr-help"><button aria-controls="qr-popover" aria-expanded="false" aria-label="Connexion tablette : afficher le QR code" class="header-network-icon" id="qr-info" title="Connexion tablette" type="button"><svg aria-hidden="true" fill="none" height="21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="21"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10.5 10.5 0 0 1 14 0M8.5 16a5.5 5.5 0 0 1 7 0"></path><circle cx="12" cy="20" fill="currentColor" r="1" stroke="none"></circle></svg></button><div aria-label="QR code de connexion tablette" class="qr-popover" id="qr-popover" role="group"><strong>Scanner pour rejoindre la partie</strong><img alt="QR code ouvrant directement la vue joueur" height="300" id="qr-image" width="300"/></div></div></div></nav></header>
<main><aside id="controls"><section hidden="True" id="sharing"><h2 class="section-title" id="panel-title-0"><button aria-controls="panel-body-0" aria-expanded="true" aria-labelledby="panel-title-0" class="section-toggle" type="button">Connexion<span aria-hidden="true" class="section-chevron">⌄</span></button></h2><div class="section-body" id="panel-body-0"><div class="connect-line"><button id="connect">Connecter</button></div><p id="connection" role="status">Même Wi-Fi requis.</p><div hidden="" id="sharepanel"><label>1. Sur la tablette, ouvrez cette adresse<select aria-label="Adresse du PC" id="network"></select></label><label>2. Entrez ce code<strong id="sessioncode"></strong></label><details><summary>Lien direct</summary><label>Lien à ouvrir sur la tablette<input aria-label="Lien joueur" id="joinlink" readonly=""/></label><button id="copylink">Copier</button></details><button id="openlink">Tester</button><button id="disconnect">Déconnecter</button></div></div></section>
<section id="create-token-section"><h2 class="section-title"><button aria-controls="panel-body-create" aria-expanded="true" class="section-toggle" type="button">Créer un pion<span aria-hidden="true" class="section-chevron">⌄</span></button></h2><div class="section-body" id="panel-body-create"><input aria-label="Nom du pion" id="tokenname" maxlength="40" placeholder="Nom"/><div id="mob-create-stats"><label> PV<input aria-label="PV max" id="newhp" max="99999" min="1" type="number" value="20"/></label><label> CA<input aria-label="CA" id="newac" max="99" min="0" type="number" value="12"/></label></div><div class="row"><button id="addpj">+ PJ</button><button id="addmob">+ Ennemi</button></div></div></section><section><h2 class="section-title" id="panel-title-4"><button aria-controls="panel-body-4" aria-expanded="true" aria-labelledby="panel-title-4" class="section-toggle" type="button">Pions<span id="count"></span><span aria-hidden="true" class="section-chevron">⌄</span></button></h2><div class="section-body" id="panel-body-4"><div id="combat-panel"><h3>⚔ Combat</h3><p id="combat-status">Hors combat · saisissez les initiatives des pions.</p><div class="row"><button id="combat-start">Début combat</button><button hidden="" id="combat-next">Suivant →</button></div><button hidden="" id="combat-end">Fin combat</button></div><div id="tokens"></div></div></section><section id="gallery-section"><h2 class="section-title"><button aria-controls="panel-body-gallery" aria-expanded="false" class="section-toggle" type="button">Images<span aria-hidden="true" class="section-chevron">⌄</span></button></h2><div class="section-body" hidden="" id="panel-body-gallery"><label class="file" id="gallery-drop">+ Importer<input accept="image/png,image/jpeg,image/webp" id="gallery-upload" multiple="" type="file"/></label><div id="gallery-list"></div></div></section></aside>
<div class="board"><div aria-label="Outils de la carte" class="bottom-toolbar" id="bottom-toolbar" role="toolbar">
<button aria-label="Main / Déplacer" aria-pressed="true" class="toolbar-icon active" data-tool="move" id="toolbar-hand" title="Main : déplacer la carte et les pions" type="button"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24"><path d="M8 13V6a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v6c0 5-3 7-7 7h-2c-2 0-3-1-4-3l-3-5a1.8 1.8 0 0 1 3-2l2 2"></path></svg></button>
<div class="toolbar-group" id="fog-tool-group"><button aria-controls="fog-popup" aria-expanded="false" aria-label="Brouillard" class="toolbar-icon" id="toolbar-fog" title="Brouillard : outils et pinceaux" type="button"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24"><path d="M5 17a4 4 0 0 1-.3-8A7 7 0 0 1 18 8a4.5 4.5 0 0 1 .5 9H5Z"></path><path d="M7 13h10M10 10h5"></path></svg></button>
<div aria-label="Réglages du brouillard" class="toolbar-popover" id="fog-popup" role="group"><div class="popover-heading">Brouillard</div><label>Taille du pinceau <output id="brushvalue">100 px</output><input id="brush" max="300" min="20" type="range" value="100"/></label><div class="fog-tool-options"><button data-tool="hide" type="button">Peindre</button><button data-tool="reveal" type="button">Effacer</button><button data-tool="rect" type="button">Zone</button></div><div class="fog-tool-actions"><button id="cover" type="button">Tout masquer</button><button id="all" type="button">Tout révéler</button></div><button id="undo" type="button">Annuler la dernière action</button></div></div>
<div class="toolbar-separator"></div>
<div class="toolbar-group" id="grid-tool-group"><button aria-controls="grid-popup" aria-expanded="false" aria-label="Afficher ou masquer la grille" class="toolbar-icon" id="toolbar-grid" title="Grille : cliquer pour afficher / masquer, survoler 1 seconde pour régler" type="button"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" viewbox="0 0 24 24"><rect height="18" rx="2" width="18" x="3" y="3"></rect><path d="M9 3v18M15 3v18M3 9h18M3 15h18"></path></svg></button>
<div aria-label="Réglages de la grille" class="toolbar-popover" id="grid-popup" role="group"><div class="popover-heading">Grille</div><label>Taille <output id="gridvalue">60 px</output><input id="size" max="160" min="20" type="range" value="60"/></label><label>Opacité <output id="opacityvalue">22 %</output><input id="gridopacity" max="100" min="0" step="1" type="range" value="22"/></label><label class="toolbar-check"><input checked="" id="snap" type="checkbox"/> Aligner les pions</label><label class="toolbar-check">Couleur <input aria-label="Couleur du quadrillage" id="gridcolor" type="color" value="#c8dae8"/></label><label class="toolbar-check" style="display:none"><input checked="" id="grid" type="checkbox"/>Afficher</label></div></div>
</div><div id="image-windows"></div><canvas aria-label="Carte de la scène" id="map"></canvas><div aria-label="Fiche du pion" hidden="" id="enemy-sheet"></div><div id="empty">Glissez-déposez une image pour charger la carte.</div><form hidden="" id="joinform"><h2>Rejoindre</h2><label> Code<input aria-label="Code de la partie" autocomplete="off" id="joincode" inputmode="numeric" maxlength="12" pattern="[0-9 ]{8,12}" placeholder="1234 5678" required=""/></label><button id="joinbutton" type="submit">Entrer</button><p id="joinerror" role="status"></p></form><footer><span id="status">Prêt · scène vierge</span><span id="zoom">100 %</span></footer></div></main><div id="toast" role="status"></div><script src="jszip.min.js"></script><script src="app.js?v=mj-ping-2" type="module"></script><script src="panels.js?v=closed-2"></script></body></html>
