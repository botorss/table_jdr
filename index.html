<!DOCTYPE html>

<html lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#121212" name="theme-color"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="apple-mobile-web-app-title" content="Table JDR"/><title>Table JDR</title><link href="manifest.webmanifest" rel="manifest"/><link href="style.css?v=surface181818" rel="stylesheet"/></head><body>
<header><b>◈ JDR</b><input aria-label="Scène" id="title" value="Nouvelle scène"/><nav><button class="active" id="gm">MJ</button><button id="player">Joueurs</button><button id="window">Ouvrir ↗</button></nav></header>
<main><aside id="controls"><section id="sharing"><h2 class="section-title" id="panel-title-0"><button aria-controls="panel-body-0" aria-expanded="true" aria-labelledby="panel-title-0" class="section-toggle" type="button">Connexion<span aria-hidden="true" class="section-chevron">⌄</span></button><span aria-label="Mac et tablette sur le même Wi-Fi. Scanne le QR sur le bouton i." class="mini-info" data-tip="Mac et tablette sur le même Wi-Fi. Scanne le QR sur le bouton i." role="note" tabindex="0">i</span></h2><div class="section-body" id="panel-body-0"><div class="connect-line"><button id="connect">Connecter</button><div class="qr-help" hidden="" id="qr-help"><button aria-controls="qr-popover" aria-expanded="false" aria-label="QR de connexion" class="qr-info" id="qr-info" type="button">i</button><div aria-label="QR code de connexion tablette" class="qr-popover" id="qr-popover" role="group"><strong>Accès joueur</strong><img alt="QR code ouvrant directement la vue joueur" height="216" id="qr-image" width="216"/></div></div></div><p id="connection" role="status">Même Wi-Fi requis.</p><div hidden="" id="sharepanel"><label>1. Sur la tablette, ouvrez cette adresse<select aria-label="Adresse du PC" id="network"></select></label><label>2. Entrez ce code<strong id="sessioncode"></strong></label><details><summary>Lien direct</summary><label>Lien à ouvrir sur la tablette<input aria-label="Lien joueur" id="joinlink" readonly=""/></label><button id="copylink">Copier</button></details><button id="openlink">Tester</button><button id="disconnect">Déconnecter</button></div></div></section><section><h2 class="section-title" id="panel-title-1"><button aria-controls="panel-body-1" aria-expanded="false" aria-labelledby="panel-title-1" class="section-toggle" type="button">Carte<span aria-hidden="true" class="section-chevron">⌄</span></button></h2><div class="section-body" hidden="" id="panel-body-1"><label class="file">Importer une carte<input accept="image/png,image/jpeg,image/webp" id="image" type="file"/></label><button id="save">Enregistrer</button><button id="export">Exporter</button><label class="file secondary">Charger une scène<input accept="application/json,.json" id="scene" type="file"/></label></div></section>
<section><h2 class="section-title" id="panel-title-2"><button aria-controls="panel-body-2" aria-expanded="false" aria-labelledby="panel-title-2" class="section-toggle" type="button">Grille<span aria-hidden="true" class="section-chevron">⌄</span></button></h2><div class="section-body" hidden="" id="panel-body-2"><label><input checked="" id="grid" type="checkbox"/> Afficher</label><label> Taille<output id="gridvalue">60 px</output><input id="size" max="160" min="20" type="range" value="60"/></label><label class="color-setting"> Couleur<input aria-label="Couleur du quadrillage" id="gridcolor" type="color" value="#c8dae8"/></label><label> Opacité<output id="opacityvalue">22 %</output><input aria-label="Intensité du quadrillage" id="gridopacity" max="100" min="0" step="1" type="range" value="22"/></label><label><input id="snap" type="checkbox"/> Aligner</label></div></section>
<section><h2 class="section-title" id="panel-title-3"><button aria-controls="panel-body-3" aria-expanded="false" aria-labelledby="panel-title-3" class="section-toggle" type="button">Brouillard<span aria-hidden="true" class="section-chevron">⌄</span></button><span aria-label="Effacer révèle; Peindre masque; Zone révèle un rectangle. Déplacement carte : Alt + glisser." class="mini-info" data-tip="Effacer révèle; Peindre masque; Zone révèle un rectangle. Déplacement carte : Alt + glisser." role="note" tabindex="0">i</span></h2><div class="section-body" hidden="" id="panel-body-3"><div class="tools"><button class="active" data-tool="move">Déplacer</button><button data-tool="reveal">Effacer</button><button data-tool="hide">Peindre</button><button data-tool="rect">Zone</button></div><label>Pinceau <output id="brushvalue">100 px</output><input id="brush" max="300" min="20" type="range" value="100"/></label><button id="all">Révéler tout</button><button id="cover">Masquer tout</button><button id="undo">Annuler</button></div></section>
<section><h2 class="section-title" id="panel-title-4"><button aria-controls="panel-body-4" aria-expanded="true" aria-labelledby="panel-title-4" class="section-toggle" type="button">Pions<span id="count"></span><span aria-hidden="true" class="section-chevron">⌄</span></button><span aria-label="L’initiative détermine le tour. Clique sur un ennemi pour ses PV et sa CA." class="mini-info" data-tip="L’initiative détermine le tour. Clique sur un ennemi pour ses PV et sa CA." role="note" tabindex="0">i</span></h2><div class="section-body" id="panel-body-4"><label class="color-setting"> PJ<input aria-label="Couleur des nouveaux PJ" id="pjcolor" type="color" value="#287db0"/></label><label class="color-setting"> Mob<input aria-label="Couleur des nouveaux mobs" id="mobcolor" type="color" value="#b14b50"/></label><input aria-label="Nom du pion" id="tokenname" maxlength="40" placeholder="Nom"/><label for="newinitiative"> Init.</label><input aria-label="Initiative du nouveau pion" id="newinitiative" max="100" min="-100" placeholder="Init." step="1" type="number"/><div id="mob-create-stats"><label> PV<input aria-label="PV max" id="newhp" max="99999" min="1" type="number" value="20"/></label><label> CA<input aria-label="CA" id="newac" max="99" min="0" type="number" value="12"/></label></div><div class="row"><button id="addpj">+ PJ</button><button id="addmob">+ Ennemi</button></div><div id="combat-panel"><h3>⚔ Combat</h3><p id="combat-status">Hors combat · saisissez les initiatives des pions.</p><div class="row"><button id="combat-start">Début combat</button><button hidden="" id="combat-next">Suivant →</button></div><button hidden="" id="combat-end">Fin combat</button></div><div id="tokens"></div></div></section></aside>
<div class="board"><div class="boardbar"><span id="viewlabel">MJ</span><div><button aria-label="Dézoomer" id="minus">−</button><button id="fit">Centrer</button><button aria-label="Zoomer" id="plus">+</button></div></div><canvas aria-label="Carte de la scène" id="map"></canvas><div aria-label="Fiche de l’ennemi" hidden="" id="enemy-sheet"></div><div id="empty">Importez une carte pour commencer.</div><form hidden="" id="joinform"><h2>Rejoindre</h2><label> Code<input aria-label="Code de la partie" autocomplete="off" id="joincode" inputmode="numeric" maxlength="12" pattern="[0-9 ]{8,12}" placeholder="1234 5678" required=""/></label><button id="joinbutton" type="submit">Entrer</button><p id="joinerror" role="status"></p></form><footer><span id="status">Prêt · sauvegarde automatique</span><span id="zoom">100 %</span></footer></div></main><div id="toast" role="status"></div><script src="app.js?v=fullscreen1" type="module"></script><script src="panels.js?v=fix3"></script></body></html>
